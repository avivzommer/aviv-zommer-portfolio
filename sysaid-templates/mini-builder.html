<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<meta name="robots" content="noindex">
<title>Template builder, interactive recreation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
<style>
  /* A hand-built recreation of the template builder for the case study. Plain HTML/CSS/JS,
     laid out from measurements of the running prototype. No product code, no design-system packages. */
  :root {
    --page: oklch(0.9769 0.0011 17.18); --white: oklch(0.9978 0.001061 17.1758);
    --line: oklch(0.933 0.0017 145.56); --line2: oklch(0.9018 0.0025 165.07); --frame: oklch(0.9219 0 0);
    --teal: oklch(0.5103 0.0862 182.2); --teal-d: oklch(0.4327 0.0706 182.84); --ring: oklch(0.6378 0.1108 181.6);
    --ink: oklch(0.325 0 0); --ink87: rgba(0,0,0,0.87); --bold: oklch(0.4435 0.0083 174.03); --mid: oklch(0.5281 0.0091 177.06);
    --sub: oklch(0.4799 0.0077 185.03); --label: oklch(0.375 0.0056 179.44); --dis: oklch(0.8109 0 0);
    --chip: oklch(0.9461 0 0); --grey: oklch(0.9761 0 0); --tint: oklch(0.9811 0.0054 183.03);
    --fill: oklch(0.9698 0.0083 236.56); --fill-b: oklch(0.9181 0.0278 229.18); --blue: oklch(0.5416 0.1258 241.56);
    --pop: oklch(0.58 0.02 250 / 0.35) 0px 2px 8px 0px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { position: relative; font-family: Figtree, sans-serif; font-size: 14px; line-height: 21px; color: var(--ink); background: var(--page); -webkit-font-smoothing: antialiased; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  svg { display: block; flex-shrink: 0; }
  .i12 svg { width: 12px; height: 12px; } .i16 svg { width: 16px; height: 16px; } .i20 svg { width: 20px; height: 20px; }
  .abs { position: absolute; }

  /* ── top bar ── */
  .org { left: 22px; top: 13px; height: 36px; display: flex; align-items: center; font-size: 14px; font-weight: 600; letter-spacing: -0.005em; color: var(--ink87); white-space: nowrap; }
  .logo { left: 15.5px; top: 13px; width: 78px; height: 36px; padding: 6px; }
  .logo svg { width: 66px; height: 24px; }
  .space { left: 101px; top: 13px; width: 250px; height: 36px; border: 1px solid var(--line); border-radius: 999px; background: var(--white); display: flex; align-items: center; padding: 0 12px 0 6px; }
  .space-dot { width: 24px; height: 24px; border-radius: 50%; background: oklch(0.9614 0.0119 184.08); border: 1px solid oklch(0.8034 0.0653 186.06); display: grid; place-items: center; color: var(--teal-d); margin-right: 8px; }
  .space b { font-size: 18px; font-weight: 600; line-height: 23.4px; flex: 1; }
  .search { left: 504px; top: 13px; width: 300px; height: 36px; border: 1px solid var(--line); border-radius: 4px; background: var(--white); display: flex; align-items: center; padding-left: 12px; gap: 8px; color: var(--sub); }
  .search svg { color: var(--bold); }
  .create { left: 813px; top: 13px; height: 36px; display: flex; color: var(--white); }
  .create b { width: 81px; background: var(--teal); border-radius: 4px 0 0 4px; border-right: 1px solid var(--white); font-size: 16px; font-weight: 600; display: grid; place-items: center; padding-left: 3px; }
  .create i { width: 40px; background: var(--teal); border-radius: 0 4px 4px 0; display: grid; place-items: center; }
  .copilot { left: 1114px; top: 12px; width: 138px; height: 38px; border: 1px solid var(--line); border-radius: 999px; background: var(--white); display: flex; align-items: center; padding: 0 16px 0 15px; gap: 11px; color: var(--teal); font-size: 16px; font-weight: 600; line-height: 20.8px; }
  .topi { top: 13px; width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink); }
  .me { left: 1392px; top: 15px; width: 32px; height: 32px; border-radius: 50%; background: var(--grey); border: 1px solid var(--line2); display: grid; place-items: center; font-weight: 600; color: var(--bold); }

  /* ── frame, sidebar ── */
  .frame { left: 16px; top: 62px; width: 1408px; height: 822px; border: 1px solid var(--frame); border-radius: 12px; overflow: hidden; }
  .side { left: 0; top: 0; width: 72px; height: 820px; background: var(--page); }
  .nav-i { position: absolute; left: 28px; color: var(--bold); }
  .nav-i svg { width: 16px; height: 16px; }
  .ailogo { left: 5px; top: 783.5px; filter: brightness(0.85); }
  .content { left: 76px; top: 0; width: 1330px; height: 820px; background: var(--white); border-radius: 12px; overflow: hidden; }

  /* ── builder header ── */
  .hd { left: 1px; top: 0; width: 1329px; height: 105px; border-bottom: 1px solid var(--line); background: var(--white); }
  .back { left: 23px; top: 18px; height: 36px; padding: 0 12px 0 10px; display: flex; align-items: center; gap: 8px; color: var(--teal); font-size: 16px; line-height: 23.4px; }
  .hd-div { left: 224px; top: 25px; width: 1px; height: 20px; background: var(--line); }
  .hd-title { left: 246.5px; top: 19.5px; font-size: 24px; font-weight: var(--tw, 600); line-height: 30px; color: var(--ink); white-space: nowrap; }
  .btn { height: 36px; padding: 0 12px; border-radius: 4px; font-size: 16px; font-weight: 600; line-height: 23.4px; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
  .btn-sec { left: 1047px; top: 18px; width: 106px; border: 1px solid var(--line); background: var(--white); color: var(--teal); }
  .btn-pub { left: 1162px; top: 18px; width: 143px; background: var(--teal); color: var(--white); }
  .btn-pub[disabled] { background: var(--frame); color: var(--dis); cursor: default; }
  .m-av { left: 24px; top: 63px; width: 24px; height: 24px; border-radius: 50%; background: var(--tint); border: 1px solid oklch(0.87 0.0434 187.31); display: grid; place-items: center; font-size: 12px; font-weight: 600; line-height: 18px; color: var(--teal-d); }
  .m-t { top: 66px; font-size: 12px; line-height: 18px; color: var(--ink87); white-space: nowrap; }
  .m-sep { left: 97px; top: 69px; width: 1px; height: 12px; background: var(--line); }
  .chip { height: 24px; border-radius: 4px; background: var(--chip); border: 1px solid var(--chip); display: inline-flex; align-items: center; padding: 2px 4px; font-size: 12px; line-height: 18px; color: var(--bold); white-space: nowrap; }
  .chip span { padding: 0 4px; }
  .chip.ic { padding-left: 6px; }
  .chip.dim span { opacity: 0.5; }
  .chip.ok { background: oklch(0.9628 0.0143 169.25); border-color: oklch(0.9628 0.0143 169.25); color: oklch(0.4196 0.0763 166.92); }
  .saved { display: flex; align-items: center; gap: 4px; margin-left: 11.8px; padding-left: 13px; border-left: 0; position: relative; font-size: 12px; line-height: 18px; color: var(--mid); white-space: nowrap; }
  .saved::before { content: ""; position: absolute; left: 0; top: 3px; width: 1px; height: 12px; background: var(--line); }

  /* ── canvas ── */
  .bd { left: 1px; top: 104.8px; width: 1329px; height: 716px; background: var(--page); }
  .main { left: 0; top: 0; width: 940px; height: 716px; background-image: radial-gradient(circle, var(--line2) 1px, transparent 1px); background-size: 20px 20px; }
  .form { left: 24px; top: 24px; width: 892px; height: 700px; background: var(--tint); border-radius: 12px; }
  .formtag { left: 50px; top: 16px; display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 18px; color: var(--mid); }
  .sr-title { left: 58px; top: 62px; font-size: 24px; font-weight: var(--tw, 600); line-height: 30px; color: var(--ink); white-space: nowrap; }
  .sl { font-size: 12px; line-height: 18px; color: var(--mid); white-space: nowrap; }
  .who { display: flex; align-items: center; gap: 4px; color: var(--mid); white-space: nowrap; }
  .who i { width: 24px; height: 24px; border-radius: 50%; background: var(--grey); border: 1px dashed var(--line2); display: grid; place-items: center; }
  .section { left: 57px; top: 186px; width: 826px; height: 500px; background: var(--white); border-radius: 12px; box-shadow: var(--pop); }
  .sec-top { left: 32px; top: 20px; width: 762px; height: 49px; border-bottom: 1px solid var(--line); }
  .sec-caret { left: 8px; top: 6px; width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 4px; display: grid; place-items: center; color: var(--teal-d); background: var(--white); }
  .sec-name { left: 53px; top: 7px; font-size: 18px; font-weight: var(--tw, 600); line-height: 23px; color: var(--ink); }
  .cell { position: absolute; border-radius: 8px; cursor: pointer; }
  .cell.sel { outline: 2px solid var(--ring); }
  .cell.glow { animation: land 3.6s ease-out 1; }
  @keyframes land { 0% { box-shadow: 0 0 0 0 rgba(107,217,185,0), 0 0 0 0 rgba(200,229,0,0); } 38% { box-shadow: rgba(107,217,185,0.255) 0 0 16.9px 4.5px, rgba(200,229,0,0.145) 0 0 36px 11.3px; } 100% { box-shadow: 0 0 0 0 rgba(107,217,185,0), 0 0 0 0 rgba(200,229,0,0); } }
  .cell .grip { position: absolute; left: 10px; top: 50%; margin-top: -6px; color: var(--mid); display: none; }
  .cell.sel .grip { display: block; }
  .lab { position: absolute; left: 32px; top: 11px; display: flex; gap: 2px; font-size: 12px; line-height: 18px; color: var(--label); white-space: nowrap; }
  .lab .req { color: oklch(0.64 0.188 23.07); }
  .rchip { position: absolute; right: 8px; top: 7px; cursor: pointer; }
  .rchip.new { animation: pop .35s cubic-bezier(.22,1,.36,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.8); } }
  .ctl { position: absolute; left: 32px; right: 8px; top: 36px; height: 36px; border: 1px solid var(--fill-b); border-radius: 4px; background: var(--fill); display: flex; align-items: center; padding: 0 12px; color: var(--blue); pointer-events: none; }
  .ctl .caret { margin-left: auto; color: var(--bold); margin-right: -2px; }
  .ctl.area { height: 102px; align-items: flex-start; padding-top: 8px; }
  .addf { left: 40px; top: 441px; width: 99px; height: 39px; border: 1px dashed var(--line2); border-radius: 8px; display: flex; align-items: center; gap: 4px; padding: 0 12px; color: var(--mid); white-space: nowrap; }
  .bar { position: absolute; z-index: 5; height: 35px; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); box-shadow: var(--pop); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .bar .tb { height: 24px; padding: 0 8px; display: flex; align-items: center; gap: 4px; color: var(--teal); border-radius: 4px; }
  .bar .ib { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 4px; color: var(--ink); }
  .bar .ib.off { color: oklch(0.8514 0 0); }
  .bar .split { width: 1px; height: 25px; background: var(--line); margin: 0 6px 0 4px; }

  /* ── panel ── */
  .handle { left: 940px; top: 0; width: 9px; height: 716px; background: linear-gradient(to right, transparent 50%, var(--white) 50%); }
  .panel { left: 949px; top: 0; width: 380px; height: 716px; background: var(--white); }
  .p-av { left: 16px; top: 11px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 1px solid; }
  .k-text { background: var(--fill); border-color: oklch(0.8439 0.0554 231.59); color: oklch(0.3753 0.0788 238.83); }
  .k-area { background: oklch(0.9728 0.0126 306.03); border-color: oklch(0.8229 0.0855 299.79); color: oklch(0.3561 0.1417 292.07); }
  .k-select { background: var(--tint); border-color: oklch(0.87 0.0434 187.31); color: var(--teal-d); }
  .p-title { left: 56px; top: 17px; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; }
  .p-title b { font-size: 16px; font-weight: 600; line-height: 20.8px; color: var(--ink87); }
  .p-title span { color: var(--mid); }
  .p-x { left: 340px; top: 15px; width: 24px; height: 24px; display: grid; place-items: center; }
  .p-switch { left: 0; top: 56px; width: 380px; height: 61px; border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .seg { display: inline-flex; height: 36px; border-radius: 4px; background: var(--grey); border: solid var(--line); border-width: 1px 0; }
  .seg button { height: 34px; padding: 4px 12px; display: flex; align-items: center; gap: 4px; font-size: 14px; line-height: 18.66px; color: var(--sub); border-radius: 4px; border: solid var(--line); border-width: 0 0 0 1px; }
  .seg button + button { border-width: 0 1px 0 0; margin-left: 6px; }
  .seg button.on { background: var(--white); color: var(--ink); font-weight: 600; border-width: 0 1px; }
  .badge { min-width: 24px; height: 16px; padding: 1px 6px 0; border-radius: 999px; background: var(--teal); color: var(--white); font-size: 11px; font-weight: 400; line-height: 16px; text-align: center; }
  .p-body { left: 0; top: 117px; width: 380px; }
  .ai-wrap { padding: 24px 0 16px; display: flex; justify-content: center; }
  .ai-btn { height: 38px; border: 1px solid var(--line); border-radius: 999px; background: var(--white); display: flex; align-items: center; gap: 11px; padding: 0 16px 0 15px; color: var(--teal); font-size: 16px; font-weight: 600; line-height: 20.8px; }
  .psec { padding: 16px; border-bottom: 1px solid var(--line); }
  .psec h3 { font-size: 14px; font-weight: 600; line-height: 21px; color: var(--ink); margin-bottom: 24px; }
  .rule { position: relative; min-height: 68px; margin-bottom: 12px; padding: 12px 78px 12px 16px; background: var(--grey); border: 1px solid var(--line); border-radius: 8px; color: var(--ink87); }
  .rule b { font-weight: 600; color: var(--ink); }
  .rule.land { animation: rise .45s cubic-bezier(.22,1,.36,1), cardglow 3.6s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes cardglow { 0% { background: oklch(0.9628 0.0143 169.25); box-shadow: 0 0 0 0 rgba(107,217,185,0); } 38% { box-shadow: rgba(107,217,185,0.255) 0 0 16.9px 4.5px, rgba(200,229,0,0.145) 0 0 36px 11.3px; } 100% { background: var(--grey); box-shadow: 0 0 0 0 rgba(107,217,185,0); } }
  .rule .acts { position: absolute; right: 16px; top: 12px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
  .rule:hover .acts { opacity: 1; }
  .ib24 { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 4px; color: var(--ink); }
  .ib24:hover { background: var(--chip); }
  .sbtn { height: 24px; padding: 0 8px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .sbtn.line { border: 1px solid var(--line); background: var(--white); color: var(--teal); font-weight: 600; }
  .sbtn.link { color: var(--teal); }
  .sbtn.fill { background: var(--teal); color: var(--white); font-weight: 600; min-width: 76px; justify-content: center; }
  .sbtn.fill[disabled] { background: var(--frame); color: var(--dis); cursor: default; }
  .sbtn.line:hover, .sbtn.link:hover { background: var(--tint); }

  .re { padding: 12px 16px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); }
  .re.fresh { animation: rise .3s cubic-bezier(.22,1,.36,1); }
  .re-lead { display: flex; align-items: center; gap: 8px; color: var(--bold); }
  .sel-b { position: relative; height: 36px; padding: 0 36px 0 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--white); display: flex; align-items: center; color: var(--ink); white-space: nowrap; }
  .sel-b .car { position: absolute; right: 9px; top: 9px; color: var(--bold); }
  .sel-b.open { border-color: var(--mid); background: transparent; }
  .sel-b.ph { background: var(--fill); border-color: var(--fill-b); color: var(--blue); }
  .clause { position: relative; margin-top: 12px; padding: 12px; border-radius: 8px; background: var(--grey); }
  .clause .sel-b.wide { width: 290px; }
  .clause::before { content: ""; position: absolute; left: 20px; top: 48px; width: 9px; height: 26px; border-left: 1px solid var(--line2); border-bottom: 1px solid var(--line2); border-bottom-left-radius: 6px; }
  .row2 { display: flex; gap: 3px; margin: 8px 0 0 16px; }
  .vals { position: relative; width: 210px; height: 36px; padding: 4px 36px 4px 4px; border: 1px solid oklch(0.9075 0.0011 17.18); border-radius: 4px; background: var(--white); display: flex; align-items: center; gap: 4px; color: var(--dis); overflow: hidden; cursor: pointer; }
  .vals .ph { padding-left: 13px; }
  .vals .car { position: absolute; right: 9px; top: 9px; }
  .vals.ready { color: var(--bold); border-color: var(--line); }
  .vals.open { border-color: var(--mid); }
  .vchip { padding: 2px 6px 2px 4px; cursor: default; }
  .vchip i { display: grid; place-items: center; cursor: pointer; }
  .re-add { margin-top: 12px; }
  .re-foot { display: flex; gap: 8px; margin-top: 12px; }

  .pop { position: absolute; z-index: 50; padding: 12px 0; border: 1px solid var(--line2); border-radius: 8px; background: var(--white); box-shadow: var(--pop); animation: fade .12s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(-3px); } }
  .opt { display: flex; align-items: center; gap: 10px; width: calc(100% - 24px); height: 33px; margin: 0 12px; padding: 6px 10px; border-radius: 4px; text-align: left; white-space: nowrap; color: var(--ink); }
  .opt:hover, .opt.on { background: var(--tint); }
  .opt .box { width: 16px; height: 16px; color: var(--mid); margin-left: 2px; }
  .opt .box.ck { border-radius: 3px; background: var(--teal); display: grid; place-items: center; }
  .opt .box.ck::after { content: ""; width: 8px; height: 4px; border-left: 1.6px solid #fff; border-bottom: 1.6px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }

  /* properties tab */
  .fld small { display: block; font-size: 12px; line-height: 18px; color: var(--label); }
  .tbox { height: 36px; border: 1px solid var(--line); border-radius: 4px; padding: 0 12px; display: flex; align-items: center; margin-bottom: 12px; color: var(--ink); }
  .sw { display: flex; align-items: center; gap: 8px; height: 20px; margin-top: 17px; font-size: 16px; line-height: 20.8px; color: var(--ink87); }
  .sw:first-of-type { margin-top: 0; }
  .sw i { width: 36px; height: 20px; border-radius: 999px; background: var(--mid); padding: 2px; transition: background .2s; cursor: pointer; }
  .sw i::after { content: ""; display: block; width: 16px; height: 16px; border-radius: 50%; background: var(--white); transition: transform .2s; }
  .sw i.on { background: var(--teal); }
  .sw i.on::after { transform: translateX(16px); }
  .psec.props { padding-bottom: 22px; }
  .hint { margin-top: 12px; color: var(--mid); }
  .sel-b.open .car, .vals.open .car { transform: rotate(180deg); }

  /* ── scenes: drawer, new-field window, publish, preview ── */
  .drawer { left: 0; top: 0; width: 280px; height: 716px; background: var(--white); }
  .drawer h2 { position: absolute; left: 16px; top: 16.8px; font-size: 18px; font-weight: 600; line-height: 23.4px; color: var(--ink87); }
  .d-x { left: 240px; top: 16px; width: 24px; height: 24px; display: grid; place-items: center; }
  .d-search { left: 16px; top: 53px; width: 248px; height: 36px; border: 1px solid var(--line); border-radius: 4px; display: flex; align-items: center; gap: 8px; padding-left: 12px; color: var(--sub); }
  .d-search svg { color: var(--bold); }
  .d-h { left: 16px; font-weight: 600; color: var(--ink87); }
  .tile { position: absolute; width: 120px; height: 95px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); display: flex; flex-direction: column; align-items: center; padding-top: 16px; gap: 8px; color: var(--ink); cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .tile:hover { border-color: var(--mid); box-shadow: var(--pop); }
  .tile i { width: 32px; height: 32px; border-radius: 50%; border: 1px solid; display: grid; place-items: center; }
  .k-check { background: oklch(0.9738 0.0075 164.94); border-color: oklch(0.8692 0.0488 173.31); color: oklch(0.4196 0.0763 166.92); }
  .k-date { background: oklch(0.9885 0.0098 87.47); border-color: oklch(0.9265 0.0621 91.15); color: oklch(0.5263 0.091 90.16); }
  .d-grp { left: 16px; top: 583px; display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--mid); }
  .d-grp i { width: 24px; height: 24px; border-radius: 50%; border: 1px solid; display: grid; place-items: center; }
  .d-row { left: 16px; width: 248px; height: 39px; border: 1px solid var(--frame); border-radius: 8px; padding: 8px 8px 8px 32px; font-size: 16px; line-height: 20.8px; color: var(--ink); }
  .main2 { left: 289px; top: 0; width: 1040px; height: 716px; overflow-y: auto; scrollbar-width: none; background-image: radial-gradient(circle, var(--line2) 1px, transparent 1px); background-size: 20px 20px; background-attachment: local; scroll-behavior: smooth; }
  .main2::-webkit-scrollbar { display: none; }
  .main2 .form { left: 70px; }

    setTimeout(() => { if (S.saving === 'team') { S.saving = null; renderCanvas(); } }, 1600);

  document.addEventListener('click', ev => {
    const card = ev.target.closest('[data-card]');
    if (card) {
      if (S.cr.phase !== 'idle' && S.cr.phase !== 'picked') return;
      if (card.dataset.card !== 'software') { setBar('This demo builds the Software installation form. Pick that card.'); return; }
      S.cr.text = PROMPT; S.cr.phase = 'picked'; renderSetup(); setBar('The card fills the box. Now press "Create template".'); return;
    }
    if (ev.target.closest('[data-act="create"]')) { if (S.cr.text && S.cr.phase === 'picked') build(); return; }
    const tile = ev.target.closest('[data-tile]');
    if (tile) {
      if (tile.dataset.tile !== 'select' || field('team')) { setBar(field('team') ? 'One new field is enough for this demo. Press Reset to start over.' : 'This demo adds a Select field. Try the Select tile.'); return; }
      if (justDragged) return;
      if (!S.draft) startDraft(S.fields.length);
      return;
    }
    const un = ev.target.closest('[data-unpick]');
    if (un) { ev.stopPropagation(); const vs = S.editing.values; vs.splice(vs.indexOf(un.dataset.unpick), 1); closePop(); render(); return; }
    const m = ev.target.closest('[data-menu]');
    if (m) { ev.stopPropagation(); if (m.classList.contains('open')) { closePop(); render(); } else MENUS[m.dataset.menu](m); return; }
    if (pop && !ev.target.closest('.pop')) { closePop(); render(); }
    if (ev.target.closest('#publish') && SCENE === 'publish' && S.dirty && S.status === 'live') { S.modal = true; S.pick = null; render(); return; }
    const act = ev.target.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'nf-addv') { addValue(); return; }
      if (a === 'nf-del') { if (S.draft.values.length > 1) S.draft.values.splice(+act.dataset.i, 1); else S.draft.values[0] = ''; renderCanvas(); return; }
      if (a === 'nf-cancel') { S.draft = null; S.dirty = false; renderCanvas(); return; }
      if (a === 'nf-add') { if (S.draft.name.trim()) addField(); return; }
      if (a === 'm-cancel') { S.modal = false; S.pick = null; render(); return; }
      if (a === 'm-pick') { S.pick = act.dataset.a; render(); return; }
      if (a === 'm-go') { publish(); return; }
      if (a === 'pvtab') { S.pv.tab = act.dataset.tab; render(); return; }
      if (a === 'chip') { if (SCENE !== 'logic') return; const id = act.closest('.cell').dataset.id; S.selected = id; S.tab = 'logic'; S.editing = null; render(); return; }
      const f = field(S.selected);
      if (a === 'tab') S.tab = act.dataset.tab;
      if (a === 'req') { f.req = !f.req; S.dirty = true; }
      if (a === 'add') { S.editing = { action: 'show', field: null, op: 'is', values: [] }; S.fresh = true; }
      if (a === 'cancel') S.editing = null;
      if (a === 'remove') { f.rules.splice(+act.dataset.i, 1); S.dirty = true; }
      if (a === 'save') {
        f.rules.push({ ...S.editing, values: [...S.editing.values] });
        S.editing = null; S.dirty = true; S.landed = f.id;
        setBar('Rule saved. It shows as a chip on the field.');
        const id = f.id; setTimeout(() => { if (S.landed === id) S.landed = null; }, 3700);
      }
      render(); return;
    }
    if (ev.target.closest('.newf')) return;
    const cell = ev.target.closest('.cell');
    if (cell && cell.dataset.id && cell.dataset.id !== S.selected && !S.draft && !CREATE) { S.selected = cell.dataset.id; S.editing = null; S.tab = field(S.selected).rules ? 'logic' : 'props'; render(); }
  });

  // ── scripted demos ──
  const cur = $('#cursor'); let run = 0;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  // When embedded in the case study, the status and the Replay / Reset controls live on the page
  // outside this frame, so nothing that is not the product sits on top of it.
  const EMBED = window.parent !== window;
  // ?loop: plays again by itself and takes no input, for the case study's hero
  const LOOP = q.has('loop'); if (LOOP) document.body.classList.add('loop');
  if (EMBED) document.body.classList.add('embedded');
  const tell = () => { if (EMBED) window.parent.postMessage({ type: 'mb-status', text: $('#bar-text').textContent, playing: document.body.classList.contains('playing') }, location.origin); };
  const setBar = t => { $('#bar-text').textContent = t; tell(); };
  window.addEventListener('message', ev => {
    if (ev.origin !== location.origin || !ev.data || ev.data.type !== 'mb-cmd') return;
    if (ev.data.cmd === 'replay') $('#replay').click();
    if (ev.data.cmd === 'reset') $('#reset').click();
  });
  async function go(sel, token, pause = 300, click = true) {
    if (token !== run) throw 0;
    const el = typeof sel === 'string' ? $(sel) : sel; if (!el) throw 0;
    const r = el.getBoundingClientRect();
    cur.style.transform = `translate(${r.left + Math.min(r.width / 2, 60)}px, ${r.top + r.height / 2}px)`;
    await wait(620); if (token !== run) throw 0;
    cur.classList.add('tap'); await wait(130); cur.classList.remove('tap');
    if (click) el.click(); await wait(pause);
  }
  async function type(sel, text, token) {
    const el = $(sel); if (!el) throw 0; el.focus({ preventScroll: true });
    for (const ch of text) { if (token !== run) throw 0; el.value += ch; el.dispatchEvent(new Event('input', { bubbles: true })); await wait(75); }
    await wait(220);
  }
  const opt = v => [...document.querySelectorAll('.pop .opt')].find(b => b.dataset.v === v);
  const DEMO = {
    logic: { start: 'Your turn. Press "Add rule".', watch: 'Watching: adding a rule to Licence key', end: 'Your turn. Select a field and add a rule.', at: [760, 620],
      run: async t => { await go('#add-rule', t); await go('#ed-action', t); await go(opt('both'), t); await go('#ed-field', t); await go(opt('owned'), t); await go('#ed-values', t); await go(opt('Yes'), t, 350); await go('#ed-save', t, 3000); } },
    fields: { start: 'Your turn. Drag the Select tile onto the form.', watch: 'Watching: dragging a new field onto the form', end: 'Your turn. Press Reset, then drag a field in yourself.', at: [700, 520],
      run: async t => {
        await go('#tile-select', t, 150, false);
        const fly = async (x, y, hold = 450) => { if (t !== run) throw 0; cur.style.transform = `translate(${x}px, ${y}px)`; ghost.classList.add('fly'); ghost.style.transform = `translate(${x}px, ${y}px)`; await wait(600); if (t !== run) throw 0; dragMove(x, y); await wait(hold); };
        const r0 = $('#tile-select').getBoundingClientRect(); dragBegin($('#tile-select')); ghost.style.transform = `translate(${r0.left + 60}px, ${r0.top + 47}px)`; void ghost.offsetWidth;
        const mid = id => { const r = $(`.cell[data-id="${id}"]`).getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
        await fly(...mid('key'), 700); await fly(...mid('owned'), 700); await fly(...mid('why'), 800);
        dragEnd(); await wait(600); await go('#nf-name', t, 100, false); await type('#nf-name', 'Team', t); await go('#nf-v0', t, 100, false); await type('#nf-v0', 'Design', t); await go('#nf-addv', t, 200); await type('#nf-v1', 'Product', t); await go('#nf-add', t, 2600); } },
    publish: { start: 'Your turn. Press "Publish changes".', watch: 'Watching: publishing the template', end: 'Published. Press Reset to try it yourself.', at: [900, 500],
      run: async t => { await go('#publish', t, 900); await go('#m-admins', t, 500); await go('#m-everyone', t, 500); await go('#m-go', t, 6400); } },
    create: { start: 'Your turn. Pick the "Software installation" card.', watch: 'Watching: a template being created from a sentence', end: 'Built. Press Reset to create it yourself.', at: [760, 640],
      run: async t => { await go('#card-software', t, 900); await go('#cr-go', t, 400); await wait(9300); if (t !== run) throw 0; } },
    preview: { start: 'Your turn. Answer "Licence already owned".', watch: 'Watching: the form reacting to an answer', end: 'Your turn. Change the answers and watch the form.', at: [900, 560],
      run: async t => { await go('#pv-owned', t); await go(opt('Yes'), t, 1700); await go('#pv-owned', t); await go(opt('No'), t, 1700); } },
  }[SCENE];
  async function play() {
    const token = ++run;
    clearTimeout(pubTimer); stopCreate(); closePop(); S = seed(); shell(); render(); if ($('#main2')) $('#main2').scrollTop = 0;
    document.body.classList.add('playing'); setBar(DEMO.watch);
    cur.style.transition = 'none'; cur.style.transform = `translate(${DEMO.at[0]}px, ${DEMO.at[1]}px)`; void cur.offsetWidth; cur.style.transition = '';
    cur.classList.add('on');
    try { await wait(700); await DEMO.run(token); } catch (e) { if (token !== run) return; }
    if (token !== run) return;
    cur.classList.remove('on'); document.body.classList.remove('playing');
    setBar(DEMO.end);
    if (LOOP) setTimeout(() => { if (token === run) play(); }, 2600);
  }
  function stop() { run++; clearTimeout(pubTimer); stopCreate(); cur.classList.remove('on'); document.body.classList.remove('playing'); closePop(); }
  $('#replay').addEventListener('click', ev => { ev.stopPropagation(); play(); });
  $('#reset').addEventListener('click', ev => { ev.stopPropagation(); stop(); S = seed(); shell(); render(); if ($('#main2')) $('#main2').scrollTop = 0; setBar(DEMO.start); });

  // test hooks for comparing against the reference screenshots: ?state=…
  if (q.get('tw')) document.documentElement.style.setProperty('--tw', q.get('tw'));
  if (st) {
    document.body.classList.add('bare');
    if (st === 'A') { field('key').rules.push({ action: 'both', field: 'owned', op: 'is', values: ['Yes'] }); }
    if (st === 'B') { S.selected = 'why'; S.editing = { action: 'show', field: null, op: 'is', values: [] }; }
    if ('DEF'.includes(st)) S.editing = { action: 'show', field: st === 'D' ? null : 'owned', op: 'is', values: st === 'F' ? ['Yes'] : [] };
    if (st === 'C') { S.selected = 'app'; S.tab = 'props'; }
    if (st === 'H') S.draft = { name: '', values: [''], index: 5 };
    if (st === 'H2') S.draft = { name: 'Team', values: ['Design', 'Product'], index: 5 };
    if (st === 'D2') S.drag = { at: 3 };
    if (st === 'D3') S.drag = { at: 2 };
    if (st === 'D4') S.drag = { at: 4 };
    if (st === 'D6') S.draft = { name: '', values: [''], index: 4 };
    if (st === 'H3') { S.fields.push({ ...TEAM }); S.selected = 'team'; S.saving = 'team'; S.dirty = true; }
    if (st === 'K') S.modal = true;
    if (st === 'L') { S.status = 'publishing'; S.toast = { text: 'Publishing…' }; }
    if (st === 'N1') S.cr = { phase: 'picked', text: PROMPT, said: 0 };
    if (st === 'N5') S.cr = { phase: 'building', text: PROMPT, said: REPLY.length };
    if (st === 'N7') S.cr = { phase: 'done', text: PROMPT, said: REPLY.length };
    if (st === 'J') S.pv.owned = 'Yes';
    if (st === 'J2') S.pv.owned = 'No';
  }
  setBar(DEMO.start);
  shell();
  if (st === 'N7') { $('#bd').innerHTML = `<div class="abs main" style="width:929px;top:-1px">${formHtml()}</div>`; S.dirty = true; }
  render(); if (CREATE) renderChat();
  if (st === 'D6') { const m = $('#main2'); m.style.scrollBehavior = 'auto'; reveal('#newf'); }
  if (st && 'H H2 H3 K L M'.split(' ').includes(st)) { const m = $('#main2'); m.style.scrollBehavior = 'auto'; m.scrollTop = st === 'H' || st === 'H2' ? m.scrollHeight : 200; }
  if (st === 'D') $('#ed-action').click();
  if (st === 'E') $('#ed-values').click();
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!st && !reduced && !q.has('noplay')) {
    let played = false;
    new IntersectionObserver(es => { if (es[0].isIntersecting && !played) { played = true; play(); } }, { threshold: 0.6 }).observe(document.body);
  }
})();
</script>
</body>
